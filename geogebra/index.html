<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>GeoGebra | 铟子vinds的学习工具</title>
	<meta name="description" content="铟子vinds 的学习工具 — GeoGebra 经典版">
	<link rel="icon" href="../favicon.ico">
	<link rel="apple-touch-icon" href="../favicon.ico">
	<link rel="stylesheet" href="../style.css">
	<script src="../theme.js"></script>
	<style>
		/* 这一页整个下半屏交给 GeoGebra, 自己不留滚动条 */
		body { overflow: hidden; }
		.ggb-main {
			position: fixed;
			top: var(--nav-h);
			left: 0;
			right: 0;
			bottom: 0;
		}
		#ggb { width: 100%; height: 100%; }
		.noscript {
			max-width: 860px;
			margin: 0 auto;
			padding: 60px 20px;
			text-align: center;
			color: var(--c-muted);
		}
	</style>
</head>
<body class="page-ggb">
	<header class="nav">
		<a class="brand" href="../index.html">铟子vinds</a>
		<a class="credit" href="https://www.geogebra.org/" target="_blank" rel="noopener noreferrer">GeoGebra® © GeoGebra GmbH</a>
		<span class="spacer"></span>
		<a class="navlink" href="../index.html">主页</a>
		<button class="theme-btn" id="theme-btn" type="button" aria-label="切换夜间模式">☾</button>
	</header>
	<main class="ggb-main">
		<div id="ggb"></div>
		<noscript><p class="noscript">GeoGebra 需要启用 JavaScript 才能运行。</p></noscript>
	</main>
	<script src="deployggb.js"></script>
	<script>
	(function () {
		'use strict';

		var host = document.getElementById('ggb');

		var params = {
			appName: 'classic',
			width: Math.max(host.clientWidth, 320),
			height: Math.max(host.clientHeight, 240),
			showToolBar: true,
			showAlgebraInput: true,
			showMenuBar: true,
			showResetIcon: true,
			enableRightClick: false,
			showKeyboardOnFocus: 'false',
			language: 'zh_CN'
		};

		var applet = new GGBApplet(params, true);
		/* 离线使用本地构建: HTML5/5.0/web/ 里的 web.nocache.js */
		applet.setHTML5Codebase('HTML5/5.0/web/');
		applet.inject('ggb');

		/* deployggb 遇到窗口变化时会缩放整个 applet; 这里改成让 GeoGebra 真正重新排版 */
		function fit() {
			var w = host.clientWidth;
			var h = host.clientHeight;
			if (!w || !h) return;

			var api = window[params.id || 'ggbApplet'];
			if (api && typeof api.setSize === 'function') {
				try { api.setSize(w, h); } catch (e) { /* 忽略 */ }
			}

			var scaler = host.querySelector('.applet_scaler');
			if (scaler) {
				scaler.style.transform = '';
				scaler.style.width = w + 'px';
				scaler.style.height = h + 'px';
				if (scaler.parentNode) {
					scaler.parentNode.style.width = w + 'px';
					scaler.parentNode.style.height = h + 'px';
				}
			}
		}

		var timer = null;
		window.addEventListener('resize', function () {
			clearTimeout(timer);
			timer = setTimeout(fit, 200);
		});
	})();
	</script>
</body>
</html>
