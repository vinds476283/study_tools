<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>可视化公式编辑 | 铟子vinds的学习工具</title>
	<meta name="description" content="铟子vinds的学习工具 — 可视化编辑公式并导出TeX">
	<link rel="icon" href="../../favicon.ico">
	<link rel="apple-touch-icon" href="../../favicon.ico">
	<link rel="stylesheet" href="../../style.css">
	<link rel="stylesheet" href="../common.css">
	<link rel="stylesheet" href="../vendor/mathlive/mathlive-fonts.css">
	<script src="../../theme.js"></script>
	<style>
		math-field {
			display: block;
			width: 100%;
			box-sizing: border-box;
			min-height: 110px;
			padding: 10px 12px;
			font-size: 22px;
			color: var(--c-text);
			background: var(--c-bg);
			border: 1px solid var(--c-line);
			border-radius: 6px;
		}
		math-field:focus-within { border-color: var(--c-nav); outline: none; }
	</style>
</head>
<body class="page-vc">
	<header class="nav">
		<a class="brand" href="../../index.html">铟子vinds</a>
		<span class="spacer"></span>
		<a class="navlink" href="../../index.html">主页</a>
		<button class="theme-btn" id="theme-btn" type="button" aria-label="切换夜间模式">☾</button>
	</header>

	<main class="main">
		<div class="vc-wrap">
			<h1>可视化公式编辑</h1>

			<section class="vc-panel">
				<span class="vc-label">公式</span>
				<math-field id="mf"></math-field>
				<div class="vc-toolbar">
					<button class="vc-btn primary" id="btn-copy" type="button">复制TeX</button>
					<button class="vc-btn" id="btn-clear" type="button">清空</button>
					<label class="vc-check"><input type="checkbox" id="wrap"> 复制时加 $$</label>
				</div>
				<p class="vc-note" id="status">共0个字符</p>
			</section>

			<section class="vc-panel">
				<label class="vc-label" for="tex-out">TeX源码（可直接粘进Markdown / LaTeX）</label>
				<textarea id="tex-out" class="vc-input" rows="6" spellcheck="false" readonly></textarea>
			</section>
		</div>
	</main>

	<footer class="foot">
		<p>Copyright © 2026-present | <a href="https://y.vinds.top" target="_blank" rel="noopener noreferrer">铟子vinds</a></p>
	</footer>

	<script src="../vendor/mathlive/mathlive.min.js"></script>
	<script src="app.js"></script>
</body>
</html>
